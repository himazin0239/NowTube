<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャンネル - NowTube</title>
<link rel="icon" href="./img/favicon.ico">
<link rel="stylesheet" href="./css/www-core-vflDhoE5U.css">
<style>
body{background:#fff;color:#222;font:13px Arial,sans-serif;line-height:1.4}
#page{max-width:970px;margin:0 auto}
#masthead{height:52px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:18px;padding:0 4px}
#logo-container img{width:100px;height:auto}
#nav{margin-left:auto;display:flex;gap:14px;align-items:center}
a{color:#03c;text-decoration:none}a:hover{text-decoration:underline}
#main{padding:18px 4px}
.channel-banner{background:linear-gradient(#f7f7f7,#e5e5e5);border:1px solid #ccc;border-radius:4px;padding:20px;margin-bottom:18px}
.channel-banner h1{font-size:23px;font-weight:bold;margin:0 0 8px}
.channel-meta{color:#666;font-size:12px}
.channel-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.button{background:linear-gradient(#6ea0e8,#3266b2);border:1px solid #24549b;color:white!important;border-radius:4px;padding:7px 15px;font-weight:bold;cursor:pointer}
.button.secondary{background:linear-gradient(#fff,#e9e9e9);color:#333!important;border-color:#bbb}
.section-title{font-size:18px;font-weight:normal;border-bottom:1px solid #ccc;padding-bottom:7px;margin:22px 0 12px}
#description{white-space:pre-wrap;overflow-wrap:anywhere}
#description-editor{width:100%;box-sizing:border-box;min-height:95px;border:1px solid #aaa;padding:8px;font:13px Arial,sans-serif}
#message{margin-top:8px;color:#444}
.video-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 14px}
.video-card{min-width:0}
.video-card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee;display:block}
.video-card .v-title{display:block;margin-top:5px;font-weight:bold;overflow-wrap:anywhere}
.video-card .v-meta{font-size:11px;color:#666;margin-top:3px}
.empty{padding:18px;background:#f6f6f6;border:1px solid #ddd;color:#666}
@media(max-width:650px){#masthead{gap:8px}#nav{gap:8px;font-size:11px}.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.channel-banner{padding:14px}}
</style>
</head>
<body>
<div id="page">
  <header id="masthead">
    <a id="logo-container" href="./index.html" title="NowTube ホーム"><img src="./img/logo.png" alt="NowTube" onerror="this.style.display='none';this.parentNode.textContent='NowTube';"></a>
    <nav id="nav"><a href="./index.html">ホーム</a><a href="./upload.html">アップロード</a><a id="my-channel-link" href="./login.html">マイチャンネル</a></nav>
  </header>
  <main id="main">
    <div id="message" role="status">チャンネルを読み込んでいます…</div>
    <section id="channel-content" hidden>
      <div class="channel-banner">
        <h1 id="channel-name">チャンネル</h1>
        <div class="channel-meta"><span id="subscriber-count">0</span> 人のチャンネル登録者 ・ 動画 <span id="video-count">0</span> 本</div>
        <div class="channel-actions">
          <button id="subscribe-button" class="button" hidden>チャンネル登録</button>
          <button id="edit-button" class="button secondary" hidden>チャンネル説明を編集</button>
          <span id="action-note" class="channel-meta"></span>
        </div>
      </div>
      <section>
        <h2 class="section-title">チャンネルについて</h2>
        <div id="description"></div>
        <div id="editor-wrap" hidden>
          <textarea id="description-editor" maxlength="1000" placeholder="チャンネルの説明を書こう（最大1000文字）"></textarea>
          <div class="channel-actions"><button id="save-description" class="button">保存</button><button id="cancel-description" class="button secondary">キャンセル</button></div>
        </div>
      </section>
      <section>
        <h2 class="section-title">アップロード動画</h2>
        <div id="videos" class="video-grid"></div>
      </section>
    </section>
  </main>
</div>
<script src="./js/channel.js"></script>
<script src="./js/channel-nav.js"></script>
</body>
</html>
