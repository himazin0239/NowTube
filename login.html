<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ログイン - NowTube</title><link rel="icon" href="./img/favicon.ico"><link rel="stylesheet" href="./css/www-core-vflDhoE5U.css"><style>body{font:13px Arial,sans-serif;color:#333;background:#fff}.auth-wrap{max-width:420px;margin:30px auto;padding:0 14px}.auth-box{border:1px solid #ccc;border-radius:4px;background:#f5f5f5;padding:18px}h1{font-size:22px;margin:0 0 16px}label{display:block;font-weight:bold;margin:13px 0 5px}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #aaa;font-size:14px}.nt-button{margin-top:15px;padding:9px 18px;border:1px solid #2459a9;border-radius:4px;color:#fff;font-weight:bold;background:linear-gradient(#7da9ed,#3d70c4);cursor:pointer}.switch{margin-top:14px}#message{white-space:pre-wrap;margin-top:12px;color:#900}header{border-bottom:1px solid #ddd;padding:12px max(calc((100% - 980px)/2),14px)}header img{width:100px;vertical-align:middle}</style></head><body><header><a href="./index.html"><img src="./img/logo.gif" alt="NowTube ホーム"></a></header><main class="auth-wrap"><div class="auth-box"><h1 id="heading">NowTubeにログイン</h1><p id="intro">アカウントにログインしてください。</p><form id="auth-form"><label for="username">ユーザー名</label><input id="username" name="username" required minlength="3" maxlength="24" autocomplete="username"><label for="password">パスワード</label><input id="password" name="password" type="password" required minlength="10" maxlength="128" autocomplete="current-password"><button class="nt-button" id="submit" type="submit">ログイン</button></form><p id="message" role="status" aria-live="polite"></p><p class="switch"><span id="switch-text">アカウントを持っていませんか？</span> <a href="#" id="switch">新規登録</a></p><p><a href="./index.html">NowTube ホームに戻る</a></p></div></main><script src="./js/auth.js"></script><script src="./js/nav-auth.js"></script></body></html>
