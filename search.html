<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動画を検索 - NowTube</title>
  <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/www-core-vflDhoE5U.css">
  <style>
    body { background:#fff; color:#333; }
    #nowtube-search-page { width:970px; max-width:calc(100% - 24px); margin:18px auto 40px; }
    .nt-search-heading { font-size:20px; font-weight:bold; border-bottom:1px solid #ccc; padding:0 0 9px; margin:18px 0 12px; }
    .nt-search-meta { color:#666; font-size:12px; margin-bottom:14px; }
    .nt-search-row { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #e5e5e5; min-height:90px; }
    .nt-search-thumb { position:relative; display:block; flex:0 0 120px; width:120px; height:90px; overflow:hidden; background:#eee; }
    .nt-search-thumb img { width:120px; height:90px; object-fit:cover; }
    .nt-search-info { min-width:0; flex:1; }
    .nt-search-title { color:#03c; font-size:16px; font-weight:bold; text-decoration:none; }
    .nt-search-title:hover, .nt-search-uploader:hover { text-decoration:underline; }
    .nt-search-description { color:#555; font-size:12px; margin:7px 0; white-space:pre-line; overflow-wrap:anywhere; }
    .nt-search-stats { font-size:11px; color:#777; }
    .nt-search-uploader { color:#666; }
    .nt-search-state { padding:22px 12px; border:1px solid #ddd; background:#f8f8f8; }
    .nt-search-form { display:flex; max-width:620px; margin:0 auto; }
    .nt-search-form input { flex:1; min-width:0; height:30px; padding:0 8px; border:1px solid #999; font-size:14px; }
    .nt-search-form button { padding:0 18px; border:1px solid #999; background:linear-gradient(#fff,#e5e5e5); color:#333; cursor:pointer; }
    @media(max-width:600px) { #nowtube-search-page { max-width:calc(100% - 16px); } .nt-search-row { gap:8px; } .nt-search-thumb,.nt-search-thumb img { width:104px;height:78px; } .nt-search-thumb { flex-basis:104px; } }
  </style>
</head>
<body>
  <div id="masthead-container">
    <div id="masthead" class="clearfix">
      <a href="./index.html" id="logo" title="NowTube ホーム"><img src="./img/logo.gif" alt="NowTube" style="max-width:120px;max-height:50px"></a>
      <form id="masthead-search" class="search-form" action="./search.html" method="get" autocomplete="off">
        <button class="search-button yt-uix-button" type="submit"><span class="yt-uix-button-content">検索</span></button>
        <div id="masthead-search-terms"><label><input id="masthead-search-term" class="search-term" name="search_query" type="text" title="検索" autocomplete="off"></label></div>
      </form>
      <div style="clear:both"></div>
    </div>
  </div>
  <main id="nowtube-search-page">
    <form class="nt-search-form" action="./search.html" method="get">
      <input id="nt-search-input" name="search_query" type="search" placeholder="動画、説明、ユーザー名を検索" aria-label="検索キーワード">
      <button type="submit">検索</button>
    </form>
    <h1 class="nt-search-heading" id="nt-search-heading">動画を検索</h1>
    <div class="nt-search-meta" id="nt-search-meta"></div>
    <div id="nt-search-results" aria-live="polite"><div class="nt-search-state">検索しています...</div></div>
  </main>
  <script src="./js/search.js"></script>
</body>
</html>
